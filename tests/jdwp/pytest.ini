[pytest]
testpaths = tests/jdwp
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    network: marks tests as requiring network connectivity
    requires_vm: marks tests as requiring a running JNode VM
    requires_jdwp: marks tests as requiring a JDWP listener
    requires_jdb: marks tests as requiring a jdb connection
    smoke: basic smoke tests that should always pass
    integration: full integration tests
addopts = -v --tb=short --strict-markers
