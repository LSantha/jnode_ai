name: Task Orchestrator
on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["opencode"]
    types: [completed]

jobs:
  orchestrate:
    if: |
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/orchestrate')) ||
      (github.event_name == 'workflow_run')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Process Orchestration
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          # 1. Find the Master Orchestrator Issue
          ORCHESTRATOR_ISSUE=$(gh issue list --label "kind/orchestrator" --state open --limit 1 --json number --jq '.[0].number')
          
          if [ -z "$ORCHESTRATOR_ISSUE" ]; then
            echo "No orchestrator issue found with label 'kind/orchestrator'. Skipping."
            exit 0
          fi

          echo "Managing Orchestrator Issue: #$ORCHESTRATOR_ISSUE"

          # 2. Get the current state
          BODY=$(gh issue view $ORCHESTRATOR_ISSUE --json body --jq '.body')
          STATUS=$(echo "$BODY" | grep "Status:" | cut -d':' -f2 | xargs)
          CURRENT=$(echo "$BODY" | grep "Current:" | cut -d':' -f2 | xargs | tr -d '#')

          # Only process if triggered by /orchestrate command (manual start)
          if [ "$EVENT_NAME" == "issue_comment" ]; then
            echo "Manual trigger - starting orchestration"
          else
            # For workflow_run: ONLY process if it matches CURRENT task (sequential processing)
            RUN_TITLE="${{ github.event.workflow_run.display_title }}"
            ISSUE_TITLE=$(gh issue view $CURRENT --json title --jq '.title')
            
            if [[ "$RUN_TITLE" != "$ISSUE_TITLE" ]]; then
              echo "Workflow '$RUN_TITLE' does not match current task #$CURRENT ('$ISSUE_TITLE'). Waiting for current task to complete."
              exit 0
            fi
            
            # Current task completed - check result
            ISSUE_STATE=$(gh issue view $CURRENT --json state --jq '.state')
            if [ "$CONCLUSION" == "success" ] && [ "$ISSUE_STATE" == "CLOSED" ]; then
              echo "Task #$CURRENT succeeded - marking as complete"
              BODY=$(echo "$BODY" | sed "s/- \[ \] #$CURRENT/- [x] #$CURRENT/")
              BODY=$(echo "$BODY" | sed "s/Retries: .*/Retries: 0/")
            else
              if [ "$ISSUE_STATE" != "CLOSED" ]; then
                echo "Task #$CURRENT completed but issue is still OPEN (work not done)"
              else
                echo "Task #$CURRENT failed ($CONCLUSION)"
              fi
              BODY=$(echo "$BODY" | sed "s/- \[ \] #$CURRENT/- [FAIL] #$CURRENT/")
              BODY=$(echo "$BODY" | sed "s/Retries: .*/Retries: 0/")
            fi
          fi

          # If not IN_PROGRESS, start fresh
          if [ "$STATUS" != "IN_PROGRESS" ]; then
            BODY=$(echo "$BODY" | sed "s/Status: .*/Status: IN_PROGRESS/")
          fi

          # 3. Find the next task (first unchecked task)
          NEXT_TASK=$(echo "$BODY" | grep -m 1 -- "- \[ \] .*#[0-9]\+" | grep -o "#[0-9]\+" | head -n 1 | tr -d '#' || true)

          if [ -z "$NEXT_TASK" ]; then
            echo "All tasks processed."
            BODY=$(echo "$BODY" | sed "s/Status: .*/Status: COMPLETED/")
            BODY=$(echo "$BODY" | sed "s/Current: .*/Current: -/")
            gh issue edit $ORCHESTRATOR_ISSUE --body "$BODY"
            gh issue comment $ORCHESTRATOR_ISSUE --body "✅ All tasks in the queue have been processed."
            exit 0
          fi

          # 4. Update state and trigger next task (sequential - only one at a time)
          BODY=$(echo "$BODY" | sed "s/Current: .*/Current: #$NEXT_TASK/")
          BODY=$(echo "$BODY" | sed "s/Retries: .*/Retries: 0/")
          
          gh issue edit $ORCHESTRATOR_ISSUE --body "$BODY"
          gh issue comment $NEXT_TASK --body "/oc Please proceed with this task."
          
          echo "Orchestrated next task: #$NEXT_TASK (sequential execution)"