name: Task Orchestrator
on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["opencode"]
    types: [completed]

jobs:
  orchestrate:
    if: |
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/orchestrate')) ||
      (github.event_name == 'workflow_run')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Process Orchestration
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const orchestrate = require('./.github/scripts/orchestrator.js');
            await orchestrate({ github, context, core });