name: Task Orchestrator
on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["opencode"]
    types: [completed]

jobs:
  orchestrate:
    if: |
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/orchestrate')) ||
      (github.event_name == 'workflow_run')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Process Orchestration
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          # 1. Find the Master Orchestrator Issue
          ORCHESTRATOR_ISSUE=$(gh issue list --label "kind/orchestrator" --state open --limit 1 --json number --jq '.[0].number')
          
          if [ -z "$ORCHESTRATOR_ISSUE" ]; then
            echo "No orchestrator issue found with label 'kind/orchestrator'. Skipping."
            exit 0
          fi

          echo "Managing Orchestrator Issue: #$ORCHESTRATOR_ISSUE"

          # 2. Get the current state
          BODY=$(gh issue view $ORCHESTRATOR_ISSUE --json body --jq '.body')
          STATUS=$(echo "$BODY" | grep "Status:" | cut -d':' -f2 | xargs)
          CURRENT=$(echo "$BODY" | grep "Current:" | cut -d':' -f2 | xargs | tr -d '#')

          # Extract task number from completed workflow run (for parallel execution support)
          if [ "$EVENT_NAME" == "workflow_run" ]; then
            RUN_TITLE="${{ github.event.workflow_run.display_title }}"
            echo "Workflow completed: $RUN_TITLE"
            
            # Find the issue number by matching title
            COMPLETED_TASK=$(gh issue list --state all --search "$RUN_TITLE" --limit 1 --json number --jq '.[0].number')
            echo "Found completed task: #$COMPLETED_TASK"
            
            # Check if the completed task is now closed
            if [ -n "$COMPLETED_TASK" ] && [ "$COMPLETED_TASK" != "null" ]; then
              COMPLETED_STATE=$(gh issue view $COMPLETED_TASK --json state --jq '.state')
              if [ "$COMPLETED_STATE" == "CLOSED" ]; then
                echo "Task #$COMPLETED_TASK is CLOSED - marking as complete"
                BODY=$(echo "$BODY" | sed "s/- \[ \] #$COMPLETED_TASK/- [x] #$COMPLETED_TASK/")
                BODY=$(echo "$BODY" | sed "s/Retries: .*/Retries: 0/")
              elif [ "$CONCLUSION" != "success" ]; then
                echo "Task #$COMPLETED_TASK failed or was cancelled ($CONCLUSION)"
                BODY=$(echo "$BODY" | sed "s/- \[ \] #$COMPLETED_TASK/- [FAIL] #$COMPLETED_TASK/")
              fi
            fi
          fi

          # If not IN_PROGRESS, only allow manual trigger to start
          if [ "$STATUS" != "IN_PROGRESS" ] && [ "$EVENT_NAME" != "issue_comment" ]; then
            echo "Status is $STATUS. Waiting for manual /orchestrate command."
            exit 0
          fi

          # 4. Find the next task
          NEXT_TASK=$(echo "$BODY" | grep -m 1 -- "- \[ \] .*#[0-9]\+" | grep -o "#[0-9]\+" | head -n 1 | tr -d '#' || true)

          if [ -z "$NEXT_TASK" ]; then
            echo "All tasks processed."
            BODY=$(echo "$BODY" | sed "s/Status: .*/Status: COMPLETED/")
            gh issue edit $ORCHESTRATOR_ISSUE --body "$BODY"
            gh issue comment $ORCHESTRATOR_ISSUE --body "✅ All tasks in the queue have been processed."
            exit 0
          fi

          # 5. Update state and trigger next agent
          BODY=$(echo "$BODY" | sed "s/Status: .*/Status: IN_PROGRESS/")
          BODY=$(echo "$BODY" | sed "s/Current: .*/Current: #$NEXT_TASK/")
          
          gh issue edit $ORCHESTRATOR_ISSUE --body "$BODY"
          gh issue comment $NEXT_TASK --body "/oc Please proceed with this task."
          
          echo "Orchestrated next task: #$NEXT_TASK"
