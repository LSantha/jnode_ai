name: Triage
run-name: "Triage #${{ github.event.issue.number }} - ${{ github.event.issue.title }}"

on:
  issue_comment:
    types: [created]

# One triage runner per issue; concurrent triggers queue instead of racing.
concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    if: |
      (!github.event.issue.pull_request) &&
      (startsWith(github.event.comment.body, '/oc triage') ||
      contains(github.event.comment.body, ' /oc triage')) &&
      !contains(github.event.comment.body, 'opencode.ai/s/') &&
      (github.event.comment.author_association == 'COLLABORATOR' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # This forces actions to use Node 24 and clears the warning
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Configure git identity
        run: |
          # Same identity as opencode.yml: the maintainer, never a bot. Triage is
          # read-only (no commit/push), kept consistent for the single convention.
          git config user.name "LSantha"
          git config user.email "LSantha@users.noreply.github.com"
      - name: Clone wiki
        run: gh repo clone LSantha/jnode_ai.wiki .wiki
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
      - name: Make checkout read-only
        run: |
          chmod -R a-w .
          chmod -R u+w .git
      - name: Select model and effort for this run
        # Same single source as opencode.yml: role "triage" resolves through
        # .github/scripts/model-config.js, so the model and its effort variant
        # are changed in one place for every agentic role.
        uses: actions/github-script@v7
        with:
          script: |
            const { modelFor } = require('./.github/scripts/model-config.js');
            const sel = modelFor('triage');
            core.info('Model selection: role=triage model=' + sel.model + ' variant=' + sel.variant);
            core.exportVariable('SELECTED_MODEL', sel.model);
            core.exportVariable('SELECTED_VARIANT', sel.variant);
      - name: Run opencode triage
        id: run_agent
        # Same bound as opencode.yml: the vendored action's unauthenticated
        # version curl is rate-limited per IP on shared runner addresses, so a
        # hang would otherwise park the job for 45+ minutes. See #870.
        timeout-minutes: 5
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: ${{ env.SELECTED_MODEL }}
          variant: ${{ env.SELECTED_VARIANT }}
          use_github_token: true
          prompt: "You are triaging JNode GitHub issue #${{ github.event.issue.number }}. Load the jnode-triage-issue skill and execute it end to end: kind/area label audit first, then exactly one report opening with '## Triage' and the completed skill template, then the body addendum. Do not call gh issue comment for the report; return the report as your final response and the GitHub action will post it. No preamble, no environment commentary, no branches, commits, pushes, or pull requests. Do not post a completion summary, status update, acknowledgement, or follow-up comment. After applying labels and writing the addendum, return the single report and stop."

      - name: Apply agent/* label and close if work-product is the comment
        if: success() || failure() || cancelled()
        env:
          PREV_CONCLUSION: ${{ steps.run_agent.outcome }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const postStep = require('./.github/scripts/opencode-post-step.js');
            await postStep({ github, context, core });

      - name: Remove agent branches and scratch
        if: always()
        run: |
          git checkout -q master 2>/dev/null || true
          git branch --list 'opencode/*' | xargs -r git branch -D
          rm -rf /tmp/triage-* /tmp/oc-triage-*
