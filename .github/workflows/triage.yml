name: Triage
run-name: "Triage #${{ github.event.issue.number }} - ${{ github.event.issue.title }}"

on:
  issue_comment:
    types: [created]

# One triage runner per issue; concurrent triggers queue instead of racing.
concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    if: |
      (!github.event.issue.pull_request) &&
      (startsWith(github.event.comment.body, '/oc triage') ||
      contains(github.event.comment.body, ' /oc triage')) &&
      !contains(github.event.comment.body, 'opencode.ai/s/') &&
      (github.event.comment.author_association == 'COLLABORATOR' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # This forces actions to use Node 24 and clears the warning
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Configure git identity
        run: |
          git config user.name "opencode-agent"
          git config user.email "opencode-agent@users.noreply.github.com"
      - name: Clone wiki
        run: gh repo clone LSantha/jnode_ai.wiki .wiki
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
      - name: Make checkout read-only
        run: chmod -R a-w .
      - name: Run opencode triage
        id: run_agent
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: openrouter/cohere/north-mini-code:free
          variant: high
          use_github_token: true

      - name: Apply agent/* label and close if work-product is the comment
        if: success() || failure() || cancelled()
        env:
          PREV_CONCLUSION: ${{ steps.run_agent.outcome }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const postStep = require('./.github/scripts/opencode-post-step.js');
            await postStep({ github, context, core });

      - name: Remove scratch
        if: always()
        run: rm -rf /tmp/triage-* /tmp/oc-triage-*
