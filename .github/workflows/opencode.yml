name: opencode
run-name: "Issue #${{ github.event.issue.number }} — ${{ github.event.issue.title }}"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# One agent per issue/PR at a time; a second trigger queues behind the first
# instead of running a competing agent on the same head. cancel-in-progress
# stays false so a queued trigger is never dropped mid-run.
concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # /oc must lead the body. A mid-line "/oc " (an agent quoting its own
    # trigger, e.g. "(after /oc fix)") must not start a run - that self-quote
    # fired a duplicate agent on PR #849. The triage/approve exclusions are
    # prefix based, matching the line-leading gate. The session-link guard
    # stays a contains() check: an agent comment is rejected wherever the
    # link appears.
    if: |
      startsWith(github.event.comment.body, '/oc ') &&
      !startsWith(github.event.comment.body, '/oc triage') &&
      !startsWith(github.event.comment.body, '/oc approve') &&
      !contains(github.event.comment.body, 'opencode.ai/s/') &&
      (github.event.comment.author_association == 'COLLABORATOR' || 
       github.event.comment.author_association == 'MEMBER' || 
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    # 45 minutes was not enough for deep VM/kernel debugging tickets: issue
    # #621 (scheduler stop/sleep-queue work) produced a full baseline,
    # reproduction and instrumentation trail and was killed at the timeout with
    # the root cause still open. 90 gives a hard ticket room for build plus
    # QEMU experiments; routine tickets finish in minutes either way.
    timeout-minutes: 90
    env:
      # This forces actions to use Node 24 and clears the warning
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Default (coding) model. Read by .github/hooks/prepare-commit-msg to stamp
      # each agent commit with an "Assisted-by: <model>" trailer, so the commit
      # attribution cannot drift from the model that actually ran. The selection
      # step below overrides this per role (review vs coding); both the value and
      # the effort variant come from .github/scripts/model-config.js, which is the
      # single place to change either.
      OPENCODE_MODEL: opencode/deepseek-v4.1-flash-free
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Do not persist the automatic GITHUB_TOKEN. A push made with it is
          # attributed to github-actions[bot], and GitHub then parks the PR's
          # Java CI run in action_required (waiting for a maintainer to approve)
          # instead of running it. The PAT is installed below instead.
          persist-credentials: false
      - name: Dedupe duplicate dispatches of this comment
        # Backstop for a redelivered webhook: if an earlier run of this
        # workflow was already dispatched for this comment, this run no-ops
        # and every later step is skipped. Fail-open on a runs-API error so
        # an outage cannot suppress a legitimate run.
        id: dedupe
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const gate = require('./.github/scripts/trigger-gate.js');
            const act = await gate.dedupeCheck({ github, context, core });
            core.setOutput('act', act ? 'true' : 'false');
      - name: Select model and effort for this run
        if: steps.dedupe.outputs.act == 'true'
        # Role -> model + effort variant, from .github/scripts/model-config.js.
        # A review (/oc review) can run a different model from the coding runs
        # (/oc, /oc fix, ...) without a second workflow: the verb is matched
        # anchored at the start of the comment body, exactly like the job's own
        # trigger gate, so a fix prompt quoting "/oc review" still codes.
        uses: actions/github-script@v7
        with:
          script: |
            const { resolveModel } = require('./.github/scripts/model-config.js');
            const sel = resolveModel((context.payload.comment || {}).body);
            core.info('Model selection: role=' + sel.role + ' model=' + sel.model + ' variant=' + sel.variant);
            core.exportVariable('SELECTED_MODEL', sel.model);
            core.exportVariable('SELECTED_VARIANT', sel.variant);
            // Keep the hook's variable equal to the model that actually runs, so
            // an Assisted-by trailer can never name a model that did not make it.
            core.exportVariable('OPENCODE_MODEL', sel.model);
      - name: Configure git identity
        if: steps.dedupe.outputs.act == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Attribute agent commits to the maintainer, never a bot. GitHub renders
          # the author avatar and the Contributors list from the git identity and
          # from Co-authored-by: trailers; the model therefore rides only in an
          # Assisted-by: trailer (see the prepare-commit-msg hook), which GitHub
          # does not parse. The GitHub noreply keeps the personal email private.
          git config user.name "LSantha"
          git config user.email "LSantha@users.noreply.github.com"
          # Git does not clone hooks, and core.hooksPath defaults to .git/hooks,
          # so point it at the tracked hooks dir to install the attribution hook.
          git config core.hooksPath "$GITHUB_WORKSPACE/.github/hooks"
          # Authenticate pushes with the PAT so a pushed commit is attributed to
          # the maintainer. Same-repo collaborator pushes are never approval
          # gated; a GITHUB_TOKEN push makes the PR's Java CI run
          # action_required and stalls the REVIEW/FEEDBACK loop until approved.
          auth=$(printf 'x-access-token:%s' "$GH_PAT" | base64 -w0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
      - name: Clone wiki
        if: steps.dedupe.outputs.act == 'true'
        run: gh repo clone LSantha/jnode_ai.wiki .wiki
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
      - name: Set up JDK 8
        if: steps.dedupe.outputs.act == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'
      - name: Install QEMU
        if: steps.dedupe.outputs.act == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 socat
      - name: Prepare jnode.properties
        if: steps.dedupe.outputs.act == 'true'
        run: cp .github/qemu/jnode.properties .
      - name: Cache ISO build
        if: steps.dedupe.outputs.act == 'true'
        id: cache-iso
        uses: actions/cache@v4
        with:
          path: all/build/cdroms/jnode-x86-lite.iso
          key: jnode-iso-${{ hashFiles('**/*.java', '**/build.xml', 'build.sh') }}
      - name: Build ISO
        if: steps.dedupe.outputs.act == 'true' && steps.cache-iso.outputs.cache-hit != 'true'
        run: sh build.sh cd-x86-lite
      - name: Run opencode
        if: steps.dedupe.outputs.act == 'true'
        id: run_agent
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          model: ${{ env.SELECTED_MODEL }}
          variant: ${{ env.SELECTED_VARIANT }}
          use_github_token: true

      - name: Apply agent/* label and close if work-product is the comment
        if: steps.dedupe.outputs.act == 'true' && (success() || failure() || cancelled())
        env:
          PREV_CONCLUSION: ${{ steps.run_agent.outcome }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const postStep = require('./.github/scripts/opencode-post-step.js');
            await postStep({ github, context, core });
